<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Grand QCM des Petits Génies de la Science</title>
<style>
  :root {
    --violet: #6c5ce7;
    --violet-dark: #5a4bd4;
    --rose: #e84393;
    --vert: #00b894;
    --rouge: #e74c3c;
    --jaune: #fdcb6e;
    --fond1: #a29bfe;
    --fond2: #74b9ff;
    --texte: #2d3436;
    --carte: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Trebuchet MS", "Segoe UI", Verdana, sans-serif;
    background: linear-gradient(135deg, var(--fond1) 0%, var(--fond2) 100%);
    min-height: 100vh;
    color: var(--texte);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }

  .conteneur {
    width: 100%;
    max-width: 820px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    flex: 1;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    color: #fff;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 1.15rem;
    text-shadow: 0 2px 4px rgba(0,0,0,.2);
  }
  .compteur {
    background: rgba(255,255,255,.25);
    padding: 6px 14px;
    border-radius: 999px;
    font-weight: bold;
    font-size: .95rem;
    white-space: nowrap;
  }

  .barre-progression {
    height: 10px;
    background: rgba(255,255,255,.35);
    border-radius: 999px;
    overflow: hidden;
  }
  .barre-progression .rempli {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--jaune), var(--rose));
    border-radius: 999px;
    transition: width .35s ease;
  }

  .carte {
    background: var(--carte);
    border-radius: 24px;
    padding: 28px 26px;
    box-shadow: 0 18px 40px rgba(0,0,0,.18);
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 18px;
    animation: apparition .35s ease;
    overflow-y: auto;
  }
  @keyframes apparition {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .badge-etape {
    align-self: flex-start;
    background: #eee9ff;
    color: var(--violet-dark);
    font-weight: bold;
    font-size: .85rem;
    padding: 6px 14px;
    border-radius: 999px;
  }

  .type-ligne {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .numero-question {
    font-size: .95rem;
    font-weight: bold;
    color: var(--violet-dark);
    background: #f1edff;
    padding: 6px 14px;
    border-radius: 999px;
  }

  .question-texte {
    font-size: 1.55rem;
    line-height: 1.35;
    font-weight: bold;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .option {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    text-align: left;
    background: #f7f8fc;
    border: 3px solid #e4e7f2;
    border-radius: 16px;
    padding: 14px 16px;
    font-size: 1.08rem;
    font-family: inherit;
    color: var(--texte);
    cursor: pointer;
    transition: transform .12s ease, border-color .12s ease, background .12s ease;
  }
  .option:hover:not(.verrouillee) {
    transform: translateY(-2px);
    border-color: var(--violet);
    background: #f0edff;
  }
  .option .lettre {
    flex-shrink: 0;
    width: 38px;
    height: 38px;
    border-radius: 12px;
    background: var(--violet);
    color: #fff;
    font-weight: bold;
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .option.choisie {
    border-color: var(--violet);
    background: #ede9ff;
  }
  .option.bonne {
    border-color: var(--vert);
    background: #e6fff7;
  }
  .option.bonne .lettre { background: var(--vert); }
  .option.fausse {
    border-color: var(--rouge);
    background: #ffecec;
  }
  .option.fausse .lettre { background: var(--rouge); }
  .option.verrouillee { cursor: default; }

  .etiquette-reponse {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 1.15rem;
    font-weight: bold;
    padding: 10px 18px;
    border-radius: 14px;
    background: #e6fff7;
    color: #00785f;
  }
  .etiquette-reponse.rate {
    background: #ffecec;
    color: #b0392e;
  }

  .explication {
    background: #fff8e6;
    border-left: 6px solid var(--jaune);
    border-radius: 12px;
    padding: 16px 18px;
    font-size: 1.08rem;
    line-height: 1.55;
  }
  .explication strong { color: #b07d17; }
  .explication.erreur {
    background: #ffecec;
    border-left-color: var(--rouge);
  }
  .explication.erreur strong { color: #b0392e; }

  .bloc-final {
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 16px;
    align-items: center;
  }
  .grand-score {
    font-size: 3.2rem;
    font-weight: bold;
    color: var(--violet-dark);
  }
  .mention {
    font-size: 1.35rem;
    font-weight: bold;
    padding: 10px 22px;
    border-radius: 999px;
    background: #f1edff;
    color: var(--violet-dark);
  }
  .bareme {
    width: 100%;
    border-collapse: collapse;
    font-size: .98rem;
  }
  .bareme th, .bareme td {
    border: 1px solid #e4e7f2;
    padding: 9px 12px;
    text-align: left;
  }
  .bareme th { background: #f1edff; }

  .zone-bonus {
    width: 100%;
    background: #eef6ff;
    border: 2px dashed var(--fond2);
    border-radius: 16px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    text-align: left;
  }
  .zone-bonus h3 { font-size: 1.15rem; }
  .reponse-bonus {
    display: none;
    background: #fff;
    border-radius: 10px;
    padding: 12px 14px;
    line-height: 1.5;
    border-left: 5px solid var(--vert);
  }

  .navigation {
    display: flex;
    gap: 12px;
    justify-content: space-between;
    padding-bottom: 10px;
  }
  .bouton {
    border: none;
    border-radius: 999px;
    padding: 15px 26px;
    font-size: 1.08rem;
    font-weight: bold;
    font-family: inherit;
    cursor: pointer;
    transition: transform .12s ease, opacity .12s ease;
  }
  .bouton:hover { transform: translateY(-2px); }
  .bouton:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  .bouton.primaire {
    background: var(--violet);
    color: #fff;
    box-shadow: 0 8px 18px rgba(108, 92, 231, .4);
    flex: 1;
    max-width: 62%;
  }
  .bouton.secondaire {
    background: rgba(255,255,255,.85);
    color: var(--violet-dark);
  }

  .astuce-clavier {
    color: rgba(255,255,255,.9);
    font-size: .85rem;
    text-align: center;
    padding-bottom: 6px;
  }
  kbd {
    background: rgba(255,255,255,.3);
    border-radius: 6px;
    padding: 1px 7px;
    font-family: inherit;
  }

  .intro-liste {
    display: flex;
    flex-direction: column;
    gap: 10px;
    font-size: 1.12rem;
    line-height: 1.5;
  }
  .intro-liste li { list-style: none; background: #f7f8fc; border-radius: 12px; padding: 12px 16px; }

  @media (max-width: 560px) {
    .question-texte { font-size: 1.25rem; }
    .carte { padding: 20px 16px; }
    .bouton { padding: 13px 18px; font-size: 1rem; }
    .bouton.primaire { max-width: 58%; }
  }
</style>
</head>
<body>
  <div class="conteneur">
    <header>
      <h1>🔬 Le Grand QCM des Petits Génies de la Science</h1>
      <div class="compteur" id="compteur">Bienvenue !</div>
    </header>

    <div class="barre-progression" aria-hidden="true">
      <div class="rempli" id="progression"></div>
    </div>

    <main class="carte" id="carte" aria-live="polite"></main>

    <div class="navigation">
      <button class="bouton secondaire" id="btnPrecedent">← Précédent</button>
      <button class="bouton primaire" id="btnSuivant">Commencer le quiz 🚀</button>
    </div>

    <p class="astuce-clavier">Astuce : utilise les flèches <kbd>←</kbd> <kbd>→</kbd> du clavier pour naviguer.</p>
  </div>

<script>
"use strict";

/* ---------------- Les questions du quiz ---------------- */

// Chaque proposition fausse porte un « pourquoi » : il est montré à l'enfant
// sur l'écran de réponse, pour expliquer SON erreur en particulier.
const QUESTIONS = [
  {
    question: "Pourquoi a-t-on des saisons sur Terre ?",
    options: [
      { texte: "Parce que la Terre est inclinée sur son axe", correct: true },
      { texte: "Parce que la Terre se rapproche du Soleil en été", correct: false, pourquoi: "C'est même le contraire : la Terre est légèrement plus loin du Soleil en juillet !" },
      { texte: "Parce que le Soleil devient plus chaud en été", correct: false, pourquoi: "Le Soleil ne change pas : c'est la Terre qui tourne inclinée autour de lui." },
      { texte: "Parce que la Lune nous protège du froid en hiver", correct: false, pourquoi: "La Lune n'a aucune action sur la température sur Terre." }
    ],
    explication: "C'est l'inclinaison de la Terre (23,5°) qui change l'ensoleillement au cours de l'année, pas la distance au Soleil. En décembre, l'hémisphère nord est incliné à l'opposé du Soleil : c'est l'hiver."
  },
  {
    question: "Combien de temps met la lumière du Soleil pour arriver jusqu'à nous ?",
    options: [
      { texte: "Environ 8 minutes", correct: true },
      { texte: "Environ 1 seconde", correct: false, pourquoi: "C'est 500 fois trop court : la lumière met 499 secondes à faire le trajet." },
      { texte: "Environ 1 heure", correct: false, pourquoi: "1 heure, c'est le temps d'un long trajet en voiture, pas celui d'un rayon de lumière !" },
      { texte: "Instantanément", correct: false, pourquoi: "Même la lumière met du temps : rien ne va plus vite qu'elle, mais elle n'est pas instantanée." }
    ],
    explication: "La lumière parcourt les 150 millions de km qui nous séparent du Soleil en 8 minutes et 19 secondes exactement (499 secondes). Si le Soleil disparaissait, on ne le saurait que 8 minutes plus tard !"
  },
  {
    question: "Que devient une étoile très massive quand elle meurt, dans le cas le plus extrême ?",
    options: [
      { texte: "Un trou noir", correct: true },
      { texte: "Une étoile à neutrons", correct: false, pourquoi: "C'est la fin d'une étoile massive un peu moins lourde : sa matière est tassée, mais pas assez pour former un trou noir." },
      { texte: "Une naine blanche", correct: false, pourquoi: "C'est la fin des étoiles comme le Soleil, bien moins massives qu'une étoile qui donne un trou noir." },
      { texte: "Une géante rouge", correct: false, pourquoi: "C'est une étape AVANT la mort : l'étoile gonfle, puis finit par s'effondrer." }
    ],
    explication: "Quand une étoile très massive a brûlé tout son carburant, son cœur s'effondre d'un coup : c'est une supernova. Il peut rester une étoile à neutrons... ou, si l'étoile était encore plus lourde, un trou noir, dont même la lumière ne peut pas s'échapper."
  },
  {
    question: "Pourquoi les astronautes flottent-ils à l'intérieur de la Station spatiale internationale ?",
    options: [
      { texte: "Parce qu'ils tombent en permanence autour de la Terre, tout comme la station", correct: true },
      { texte: "Parce qu'il n'y a aucune gravité dans l'espace", correct: false, pourquoi: "Faux : à 400 km d'altitude, la gravité est encore environ 88 % de celle de la surface !" },
      { texte: "Parce que leurs combinaisons contiennent des aimants", correct: false, pourquoi: "Les combinaisons n'ont pas d'aimants, et l'apesanteur règne aussi sans combinaison." },
      { texte: "Parce que l'air de la station les pousse vers le haut", correct: false, pourquoi: "L'air pousse dans toutes les directions, jamais vers le haut uniquement." }
    ],
    explication: "Il y a bien de la gravité là-haut (environ 88 % de celle de la surface !). Mais la station tombe en permanence autour de la Terre, et les astronautes tombent avec elle : c'est l'apesanteur."
  },
  {
    question: "Pourquoi voit-on la Lune briller la nuit ?",
    options: [
      { texte: "Elle reflète la lumière du Soleil", correct: true },
      { texte: "Elle produit sa propre lumière", correct: false, pourquoi: "Seules les étoiles produisent leur propre lumière, pas les lunes ni les planètes." },
      { texte: "Elle reflète la lumière des étoiles", correct: false, pourquoi: "Les étoiles sont bien trop loin : c'est la lumière du Soleil, tout près, qui éclaire la Lune." },
      { texte: "Elle est chaude et rougeoie comme une braise", correct: false, pourquoi: "La Lune est un monde de roche froide : sa face éclairée atteint à peine 120 °C, et elle ne rougeoie pas." }
    ],
    explication: "La Lune ne produit aucune lumière : elle réfléchit celle du Soleil, comme un miroir gris."
  },
  {
    question: "Quel objet est si dense qu'une cuillère à café de sa matière pèserait des milliards de tonnes ?",
    options: [
      { texte: "Une étoile à neutrons", correct: true },
      { texte: "Une naine blanche", correct: false, pourquoi: "Très dense aussi (une cuillère en pèserait plusieurs tonnes), mais des millions de fois moins qu'une étoile à neutrons." },
      { texte: "Le cœur de la Terre", correct: false, pourquoi: "Le cœur de la Terre est du fer très dense, mais une cuillère à café n'y pèserait qu'une centaine de grammes." },
      { texte: "Le Soleil", correct: false, pourquoi: "Le Soleil est énorme, mais il est fait de gaz : sa densité moyenne vaut à peine une fois et demie celle de l'eau." }
    ],
    explication: "Dans une étoile à neutrons, une masse plus lourde que le Soleil est tassée dans une boule de la taille d'une ville : une cuillère à café de cette matière pèserait environ deux milliards de tonnes sur Terre !"
  },
  {
    question: "Quelle est l'étoile la plus proche de la Terre (après le Soleil) ?",
    options: [
      { texte: "Proxima du Centaure", correct: true },
      { texte: "Sirius", correct: false, pourquoi: "Sirius est l'étoile la plus brillante de notre ciel de nuit, mais elle est deux fois plus loin (8,6 années-lumière)." },
      { texte: "Bételgeuse", correct: false, pourquoi: "Bételgeuse est une géante rouge située à des centaines d'années-lumière." },
      { texte: "Véga", correct: false, pourquoi: "Véga est une belle étoile brillante, mais elle est à 25 années-lumière." }
    ],
    explication: "Proxima du Centaure, à environ 4,2 années-lumière. Elle est si petite qu'on ne la voit pas à l'œil nu, alors que Sirius, deux fois plus loin, est l'étoile la plus brillante de notre ciel nocturne."
  },
  {
    question: "Combien de planètes compte notre système solaire ?",
    options: [
      { texte: "8", correct: true },
      { texte: "7", correct: false, pourquoi: "Il y en a une de plus : de Mercure à Neptune, on en compte 8." },
      { texte: "9", correct: false, pourquoi: "C'était le compte avant 2006, quand on ajoutait encore Pluton." },
      { texte: "12", correct: false, pourquoi: "Les planètes naines sont nombreuses, mais les grandes planètes ne sont que 8." }
    ],
    explication: "8 planètes : Mercure, Vénus, Terre, Mars, Jupiter, Saturne, Uranus et Neptune. Pluton est trop petite : depuis 2006, c'est une « planète naine »."
  },
  {
    question: "Quel est le plus grand volcan connu du système solaire ?",
    options: [
      { texte: "Olympus Mons, sur Mars", correct: true },
      { texte: "Le Mauna Loa, à Hawaï", correct: false, pourquoi: "C'est le plus grand volcan de la Terre, mais il est deux fois moins haut qu'Olympus Mons." },
      { texte: "Le Vésuve, en Italie", correct: false, pourquoi: "Le Vésuve est célèbre pour avoir enseveli Pompéi, mais il ne mesure « que » 1 280 m de haut." },
      { texte: "Un volcan de Vénus", correct: false, pourquoi: "Vénus a des volcans, mais aucun n'approche la taille colossale d'Olympus Mons." }
    ],
    explication: "Olympus Mons, sur Mars, mesure environ 22 km de haut — près de deux fois et demie la hauteur de l'Everest — et 600 km de large, avec des pentes si douces que tu pourrais y marcher sans voir le sommet. Il a pu devenir si géant parce que la croûte de Mars ne bouge pas : le volcan est resté assis au même endroit pendant des millions d'années."
  },
  {
    question: "Que se passe-t-il pendant une éclipse de Soleil ?",
    options: [
      { texte: "La Lune passe entre la Terre et le Soleil", correct: true },
      { texte: "La Terre passe entre la Lune et le Soleil", correct: false, pourquoi: "C'est une éclipse de Lune : la Lune passe alors dans l'ombre de la Terre." },
      { texte: "Le Soleil s'éteint pendant quelques minutes", correct: false, pourquoi: "Le Soleil ne s'éteint jamais : c'est son ombre qui passe sur nous." },
      { texte: "Une comète vient masquer le Soleil", correct: false, pourquoi: "Les comètes sont bien trop petites et bien trop loin pour cacher le Soleil." }
    ],
    explication: "La Lune se glisse devant le Soleil et projette son ombre sur la Terre. Quand c'est la Terre qui passe entre le Soleil et la Lune, c'est une éclipse de Lune."
  },
  {
    question: "Pourquoi Mars est-elle surnommée la « planète rouge » ?",
    options: [
      { texte: "Parce que son sol est riche en oxyde de fer, c'est de la rouille", correct: true },
      { texte: "Parce que son atmosphère est rouge", correct: false, pourquoi: "Son atmosphère est très fine et pâle : la couleur vient du sol, pas de l'air." },
      { texte: "Parce qu'elle est très proche du Soleil", correct: false, pourquoi: "Mars est même plus loin du Soleil que la Terre." },
      { texte: "Parce que ses nuages sont rouges", correct: false, pourquoi: "Ses nuages sont pâles et minces : c'est le sol qui est rouge." }
    ],
    explication: "Son sol contient beaucoup d'oxyde de fer... exactement de la rouille, comme sur un vieux vélo !"
  },
  {
    question: "Comment s'appelle la galaxie dans laquelle se trouve la Terre ?",
    options: [
      { texte: "La Voie lactée", correct: true },
      { texte: "Andromède", correct: false, pourquoi: "Andromède est une autre galaxie, la voisine de la nôtre." },
      { texte: "Orion", correct: false, pourquoi: "Orion est une constellation : un dessin d'étoiles de notre ciel." },
      { texte: "La Grande Ourse", correct: false, pourquoi: "La Grande Ourse est aussi une constellation, pas une galaxie." }
    ],
    explication: "Nous vivons dans la Voie lactée, une immense spirale de plus de 100 milliards d'étoiles. Andromède est une autre galaxie, la plus proche de la nôtre."
  },
  {
    question: "Qui a marché le premier sur la Lune ?",
    options: [
      { texte: "Neil Armstrong", correct: true },
      { texte: "Buzz Aldrin", correct: false, pourquoi: "Buzz Aldrin a posé le pied sur la Lune juste après lui : il est le deuxième homme à y avoir marché." },
      { texte: "Youri Gagarine", correct: false, pourquoi: "Gagarine a été le premier humain dans l'espace (1961), mais il n'est jamais allé sur la Lune." },
      { texte: "Michael Collins", correct: false, pourquoi: "Il pilotait le vaisseau resté en orbite autour de la Lune pendant que ses deux coéquipiers descendaient." }
    ],
    explication: "En juillet 1969, Neil Armstrong a posé le premier pied sur la Lune (mission Apollo 11). Buzz Aldrin l'a suivi quelques minutes plus tard, sous les yeux de Michael Collins, resté en orbite."
  },
  {
    question: "Qu'est-ce qu'une comète ?",
    options: [
      { texte: "Un bloc de glace et de poussière", correct: true },
      { texte: "Une étoile qui tombe du ciel", correct: false, pourquoi: "Une « étoile filante » est un grain de poussière qui brûle dans l'atmosphère." },
      { texte: "Un morceau détaché de la Lune", correct: false, pourquoi: "Les comètes viennent du fond du système solaire, pas de la Lune." },
      { texte: "Un nuage de feu dans l'espace", correct: false, pourquoi: "Une comète est glacée ; sa belle queue est faite de gaz et de poussière." }
    ],
    explication: "Une comète est un gros « boulet de neige sale ». Quand elle approche du Soleil, sa glace se transforme en gaz et lui fait une magnifique queue brillante."
  },
  {
    question: "Pourquoi les étoiles semblent-elles scintiller la nuit ?",
    options: [
      { texte: "Parce que leur lumière traverse l'air, qui bouge sans arrêt", correct: true },
      { texte: "Parce qu'elles s'allument et s'éteignent vraiment", correct: false, pourquoi: "Une étoile brille sans interruption pendant des millions d'années." },
      { texte: "Parce qu'elles tremblent dans le ciel", correct: false, pourquoi: "Elles sont immenses et fixes : c'est leur lumière qui tremble, pas elles." },
      { texte: "Parce que la Lune les fait clignoter", correct: false, pourquoi: "La Lune n'a aucune action sur la lumière des étoiles." }

  {

      { texte: "Parce qu'on voit une partie différente de sa face éclairée par le Soleil", correct: true },
      { texte: "Parce qu'elle se déforme comme une boule de pâte", correct: false, pourquoi: "La Lune est un globe de roche solide : elle ne change jamais de forme, seulement d'éclairage." },
      { texte: "Parce qu'un nuage passe devant elle", correct: false, pourquoi: "Un nuage peut masquer la Lune, mais il ne lui donne pas une forme de croissant." },

/* ---------------- Préparation des diapositives ---------------- */

function melanger(liste) {
  const copie = liste.slice();
  for (let i = copie.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = copie[i];
    copie[i] = copie[j];
    copie[j] = tmp;
  }
  return copie;
}

const LETTRES = ["A", "B", "C", "D"];
const NB_QUESTIONS = 20; // nombre de questions tirées au hasard à chaque partie

// Seuils des mentions, en proportion du nombre de questions (18 / 15 / 10 sur 20)
const SEUIL_NOBEL = Math.round(NB_QUESTIONS * 0.9);
const SEUIL_JEUNE = Math.round(NB_QUESTIONS * 0.75);
const SEUIL_CHERCHEUR = Math.round(NB_QUESTIONS * 0.5);

// Pioche NB_QUESTIONS questions au hasard dans tout le quiz,
// et mélange les propositions de chacune (la lettre change donc à chaque partie).
function tirerQuestions() {
  return melanger(QUESTIONS).slice(0, NB_QUESTIONS).map(function (q) {
    return {
      question: q.question,
      explication: q.explication,
      optionsAffichees: melanger(q.options),
      choix: null,     // index de l'option choisie par l'enfant
      revelee: false   // devient vrai dès que la réponse a été montrée : le score est verrouillé
    };
  });
}

// Diapositives : intro, puis (question, réponse) par question, puis l'écran final
function construireDiapos() {
  const dia = [{ type: "intro" }];
  selection.forEach(function (_, i) {
    dia.push({ type: "question", index: i });
    dia.push({ type: "reponse", index: i });
  });
  dia.push({ type: "final" });
  return dia;
}

function scoreActuel() {
  let score = 0;
  selection.forEach(function (q) {
    if (q.choix !== null && q.optionsAffichees[q.choix].correct) score++;
  });
  return score;
}

function mention(score) {
  if (score >= SEUIL_NOBEL) return { titre: "🧪 Prix Nobel en herbe", texte: "Franchement impressionnant !" };
  if (score >= SEUIL_JEUNE) return { titre: "🔬 Jeune scientifique", texte: "Très solide, encore quelques notions à explorer." };
  if (score >= SEUIL_CHERCHEUR) return { titre: "🌱 Chercheur en herbe", texte: "Bonne base, continue à poser des questions !" };
  return { titre: "🚀 Astronaute en formation", texte: "Chaque scientifique a commencé quelque part !" };
}

    <div class="type-ligne">
      <span class="numero-question">Question ${i + 1} / ${selection.length}</span>
    </div>
    <h2 class="question-texte">${q.question}</h2>
    <div class="options">`;

  q.optionsAffichees.forEach(function (opt, j) {
    let classe = "option";
    if (q.revelee) {
      // La réponse a déjà été montrée : le choix est verrouillé
      classe += " verrouillee";
      if (opt.correct) {
        classe += " bonne";
      } else if (q.choix === j) {
        classe += " fausse";
      }
    } else if (q.choix === j) {
      classe += " choisie";
    }
    const balise = q.revelee ? "div" : "button";
    html += `
      <${balise} class="${classe}" data-option="${j}">
        <span class="lettre">${LETTRES[j]}</span>
        <span>${opt.texte}</span>
      </${balise}>`;
  });

  html += `
    </div>
    <div class="explication">${q.revelee
      ? "<strong>🔒 Réponse déjà validée :</strong> elle ne peut plus être changée. Clique sur « Voir la réponse → » pour revoir l'explication."
      : "<strong>Astuce :</strong> choisis ta réponse, puis clique sur « Voir la réponse » pour découvrir l'explication."}</div>`;
  return html;
}

function rendreReponse(i) {
  const q = selection[i];
  const aChoisi = q.choix !== null;
  const optChoisie = aChoisi ? q.optionsAffichees[q.choix] : null;
  const juste = aChoisi && optChoisie.correct;

  let etiquette;
  if (!aChoisi) {
    etiquette = `<div class="etiquette-reponse rate">🤔 Pas de réponse choisie pour cette question</div>`;
  } else if (juste) {
    etiquette = `<div class="etiquette-reponse">✅ Bravo, c'est correct !</div>`;
  } else {
    etiquette = `<div class="etiquette-reponse rate">❌ Pas tout à fait... on apprend avec ses erreurs !</div>`;
  }

  // Explication ciblée : pourquoi LA réponse choisie par l'enfant est fausse
  let noteErreur = "";
  if (optChoisie && !juste && optChoisie.pourquoi) {
    noteErreur = `
    <div class="explication erreur"><strong>Tu as répondu « ${optChoisie.texte} » :</strong> ${optChoisie.pourquoi}</div>`;
  }

  let html = `
    <div class="type-ligne">
      <span class="numero-question">Réponse ${i + 1} / ${selection.length}</span>
    </div>
    ${etiquette}
    <h2 class="question-texte">${q.question}</h2>
    <div class="options">`;

  q.optionsAffichees.forEach(function (opt, j) {
    let classe = "option verrouillee";
    if (opt.correct) {
      classe += " bonne";
    } else if (q.choix === j) {
      classe += " fausse";
    }
    html += `
      <div class="${classe}">
        <span class="lettre">${LETTRES[j]}</span>
        <span>${opt.texte}</span>
      </div>`;
  });

  html += `
    </div>${noteErreur}
    <div class="explication"><strong>Pourquoi ?</strong> ${q.explication}</div>`;
  return html;
}

function rendreFinal() {
  const score = scoreActuel();
  const sansReponse = selection.filter(function (q) { return q.choix === null; }).length;
  const erreurs = selection.length - score - sansReponse;
  const m = mention(score);
  return `
    <div class="bloc-final">
      <div class="type-ligne"><span class="badge-etape">🏆 Résultat final</span></div>
      <div class="grand-score">${score} / ${selection.length}</div>
      <p style="font-size:1.1rem;">✅ ${score} bonne${score > 1 ? "s" : ""} réponse${score > 1 ? "s" : ""} · ❌ ${erreurs} erreur${erreurs > 1 ? "s" : ""} · 🤔 ${sansReponse} sans réponse</p>
      <div class="mention">${m.titre}</div>
      <p style="font-size:1.15rem; line-height:1.5;">${m.texte}</p>
      <table class="bareme">
        <tr><th>Score</th><th>Niveau</th></tr>
        <tr><td>${SEUIL_NOBEL}–${NB_QUESTIONS}</td><td>🧪 Prix Nobel en herbe</td></tr>
        <tr><td>${SEUIL_JEUNE}–${SEUIL_NOBEL - 1}</td><td>🔬 Jeune scientifique</td></tr>
        <tr><td>${SEUIL_CHERCHEUR}–${SEUIL_JEUNE - 1}</td><td>🌱 Chercheur en herbe</td></tr>
        <tr><td>0–${SEUIL_CHERCHEUR - 1}</td><td>🚀 Astronaute en formation</td></tr>
      </table>
      <div class="zone-bonus">
        <h3>🌟 Défi bonus (pour les plus rapides)</h3>
        <p>${BONUS.question}</p>
        <button class="bouton secondaire" id="btnBonus">Voir la réponse du bonus</button>
        <div class="reponse-bonus" id="reponseBonus"><strong>Réponse :</strong> ${BONUS.reponse}</div>
      </div>
      <button class="bouton primaire" id="btnRecommencer" style="max-width:100%;">🔄 Recommencer le quiz</button>
    </div>`;
}

function rendre() {
  const dia = DIAPOS[position];

  if (dia.type === "intro") {
    carte.innerHTML = rendreIntro();
    compteur.textContent = "Bienvenue !";
  } else if (dia.type === "question") {
    carte.innerHTML = rendreQuestion(dia.index);
    compteur.textContent = "Question " + (dia.index + 1) + " / " + selection.length;
    if (!selection[dia.index].revelee) {
      carte.querySelectorAll(".option").forEach(function (bouton) {
        bouton.addEventListener("click", function () {
          selection[dia.index].choix = parseInt(bouton.getAttribute("data-option"), 10);
          rendre();
        });
      });
    }
  } else if (dia.type === "reponse") {
    selection[dia.index].revelee = true; // verrouille le choix : il ne peut plus changer
    carte.innerHTML = rendreReponse(dia.index);
    compteur.textContent = "Réponse " + (dia.index + 1) + " / " + selection.length;
  } else {
    carte.innerHTML = rendreFinal();
    compteur.textContent = "Terminé !";
    const btnBonus = document.getElementById("btnBonus");
    btnBonus.addEventListener("click", function () {
      const bloc = document.getElementById("reponseBonus");
      bloc.style.display = "block";
      btnBonus.style.display = "none";
    });
    document.getElementById("btnRecommencer").addEventListener("click", recommencer);
  }

  // Barre de progression : intro = 0 %, écran final = 100 %
  const pourcentage = Math.round((position / (DIAPOS.length - 1)) * 100);
  progression.style.width = pourcentage + "%";

  // Bouton précédent
  btnPrecedent.disabled = position === 0;

  // Libellé du bouton suivant
  if (dia.type === "intro") {
    btnSuivant.textContent = "Commencer le quiz 🚀";
    btnSuivant.style.display = "";
  } else if (dia.type === "question") {
    btnSuivant.textContent = "Voir la réponse →";
    btnSuivant.style.display = "";
  } else if (dia.type === "reponse") {
    const derniere = dia.index === selection.length - 1;
    btnSuivant.textContent = derniere ? "Voir mon score 🏆" : "Question suivante →";
    btnSuivant.style.display = "";
  } else {
    btnSuivant.style.display = "none";
  }

  carte.scrollTop = 0;
}

function avancer() {
  if (position < DIAPOS.length - 1) {
    position++;
    rendre();
  }
}

function reculer() {
  if (position > 0) {
    position--;
    rendre();
  }
}

function recommencer() {
  selection = tirerQuestions(); // un tout nouveau tirage de 20 questions
  DIAPOS = construireDiapos();
  position = 0;
  rendre();
}

/* ---------------- Événements ---------------- */

btnSuivant.addEventListener("click", avancer);
btnPrecedent.addEventListener("click", reculer);

document.addEventListener("keydown", function (e) {
  if (e.key === "ArrowRight" || e.key === " ") {
    // Sur un bouton, la barre d'espace doit activer le bouton (choisir une option,
    // ou cliquer sur « Suivant »), pas faire avancer en double.
    if (e.key === " " && e.target && e.target.closest && e.target.closest("button")) return;
    if (DIAPOS[position].type !== "final" && btnSuivant.style.display !== "none") {
      e.preventDefault();
      avancer();
    }
  } else if (e.key === "ArrowLeft") {
    e.preventDefault();
    reculer();
  }
});

rendre();
</script>
</body>
</html>
