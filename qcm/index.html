<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Grand QCM des Petits Génies de la Science</title>
<style>
  :root {
    --violet: #6c5ce7;
    --violet-dark: #5a4bd4;
    --rose: #e84393;
    --vert: #00b894;
    --rouge: #e74c3c;
    --jaune: #fdcb6e;
    --fond1: #a29bfe;
    --fond2: #74b9ff;
    --texte: #2d3436;
    --carte: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Trebuchet MS", "Segoe UI", Verdana, sans-serif;
    background: linear-gradient(135deg, var(--fond1) 0%, var(--fond2) 100%);
    min-height: 100vh;
    color: var(--texte);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }

  .conteneur {
    width: 100%;
    max-width: 820px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    flex: 1;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    color: #fff;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 1.15rem;
    text-shadow: 0 2px 4px rgba(0,0,0,.2);
  }
  .compteur {
    background: rgba(255,255,255,.25);
    padding: 6px 14px;
    border-radius: 999px;
    font-weight: bold;
    font-size: .95rem;
    white-space: nowrap;
  }

  .barre-progression {
    height: 10px;
    background: rgba(255,255,255,.35);
    border-radius: 999px;
    overflow: hidden;
  }
  .barre-progression .rempli {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--jaune), var(--rose));
    border-radius: 999px;
    transition: width .35s ease;
  }

  .carte {
    background: var(--carte);
    border-radius: 24px;
    padding: 28px 26px;
    box-shadow: 0 18px 40px rgba(0,0,0,.18);
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 18px;
    animation: apparition .35s ease;
    overflow-y: auto;
  }
  @keyframes apparition {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .badge-etape {
    align-self: flex-start;
    background: #eee9ff;
    color: var(--violet-dark);
    font-weight: bold;
    font-size: .85rem;
    padding: 6px 14px;
    border-radius: 999px;
  }

  .type-ligne {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .numero-question {
    font-size: .95rem;
    font-weight: bold;
    color: var(--violet-dark);
    background: #f1edff;
    padding: 6px 14px;
    border-radius: 999px;
  }

  .question-texte {
    font-size: 1.55rem;
    line-height: 1.35;
    font-weight: bold;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .option {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    text-align: left;
    background: #f7f8fc;
    border: 3px solid #e4e7f2;
    border-radius: 16px;
    padding: 14px 16px;
    font-size: 1.08rem;
    font-family: inherit;
    color: var(--texte);
    cursor: pointer;
    transition: transform .12s ease, border-color .12s ease, background .12s ease;
  }
  .option:hover:not(.verrouillee) {
    transform: translateY(-2px);
    border-color: var(--violet);
    background: #f0edff;
  }
  .option .lettre {
    flex-shrink: 0;
    width: 38px;
    height: 38px;
    border-radius: 12px;
    background: var(--violet);
    color: #fff;
    font-weight: bold;
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .option.choisie {
    border-color: var(--violet);
    background: #ede9ff;
  }
  .option.bonne {
    border-color: var(--vert);
    background: #e6fff7;
  }
  .option.bonne .lettre { background: var(--vert); }
  .option.fausse {
    border-color: var(--rouge);
    background: #ffecec;
  }
  .option.fausse .lettre { background: var(--rouge); }
  .option.verrouillee { cursor: default; }

  .etiquette-reponse {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 1.15rem;
    font-weight: bold;
    padding: 10px 18px;
    border-radius: 14px;
    background: #e6fff7;
    color: #00785f;
  }
  .etiquette-reponse.rate {
    background: #ffecec;
    color: #b0392e;
  }

  .explication {
    background: #fff8e6;
    border-left: 6px solid var(--jaune);
    border-radius: 12px;
    padding: 16px 18px;
    font-size: 1.08rem;
    line-height: 1.55;
  }
  .explication strong { color: #b07d17; }
  .explication.erreur {
    background: #ffecec;
    border-left-color: var(--rouge);
  }
  .explication.erreur strong { color: #b0392e; }

  .bloc-final {
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 16px;
    align-items: center;
  }
  .grand-score {
    font-size: 3.2rem;
    font-weight: bold;
    color: var(--violet-dark);
  }
  .mention {
    font-size: 1.35rem;
    font-weight: bold;
    padding: 10px 22px;
    border-radius: 999px;
    background: #f1edff;
    color: var(--violet-dark);
  }
  .bareme {
    width: 100%;
    border-collapse: collapse;
    font-size: .98rem;
  }
  .bareme th, .bareme td {
    border: 1px solid #e4e7f2;
    padding: 9px 12px;
    text-align: left;
  }
  .bareme th { background: #f1edff; }

  .navigation {
    display: flex;
    gap: 12px;
    justify-content: space-between;
    padding-bottom: 10px;
  }
  .bouton {
    border: none;
    border-radius: 999px;
    padding: 15px 26px;
    font-size: 1.08rem;
    font-weight: bold;
    font-family: inherit;
    cursor: pointer;
    transition: transform .12s ease, opacity .12s ease;
  }
  .bouton:hover { transform: translateY(-2px); }
  .bouton:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  .bouton.primaire {
    background: var(--violet);
    color: #fff;
    box-shadow: 0 8px 18px rgba(108, 92, 231, .4);
    flex: 1;
    max-width: 62%;
  }
  .bouton.secondaire {
    background: rgba(255,255,255,.85);
    color: var(--violet-dark);
  }

  .astuce-clavier {
    color: rgba(255,255,255,.9);
    font-size: .85rem;
    text-align: center;
    padding-bottom: 6px;
  }
  kbd {
    background: rgba(255,255,255,.3);
    border-radius: 6px;
    padding: 1px 7px;
    font-family: inherit;
  }

  .intro-liste {
    display: flex;
    flex-direction: column;
    gap: 10px;
    font-size: 1.12rem;
    line-height: 1.5;
  }
  .intro-liste li { list-style: none; background: #f7f8fc; border-radius: 12px; padding: 12px 16px; }

  @media (max-width: 560px) {
    .question-texte { font-size: 1.25rem; }
    .carte { padding: 20px 16px; }
    .bouton { padding: 13px 18px; font-size: 1rem; }
    .bouton.primaire { max-width: 58%; }
  }
</style>
</head>
<body>
  <div class="conteneur">
    <header>
      <h1>🔬 Le Grand QCM des Petits Génies de la Science</h1>
      <div class="compteur" id="compteur">Bienvenue !</div>
    </header>

    <div class="barre-progression" aria-hidden="true">
      <div class="rempli" id="progression"></div>
    </div>

    <main class="carte" id="carte" aria-live="polite"></main>

    <div class="navigation">
      <button class="bouton secondaire" id="btnPrecedent">← Précédent</button>
      <button class="bouton primaire" id="btnSuivant">Commencer le quiz 🚀</button>
    </div>

    <p class="astuce-clavier">Astuce : utilise les flèches <kbd>←</kbd> <kbd>→</kbd> du clavier pour naviguer.</p>
  </div>

<script>
"use strict";

/* ---------------- Les questions du quiz ---------------- */

// Chaque proposition fausse porte un « pourquoi » : il est montré à l'enfant
// sur l'écran de réponse, pour expliquer SON erreur en particulier.
const QUESTIONS = [
  {
    question: "Que trouve-t-on au centre d'un atome ?",
    options: [
      { texte: "Un noyau de protons et de neutrons", correct: true },
      { texte: "Du vide, et rien d'autre", correct: false, pourquoi: "Le vide occupe presque tout le volume, mais au centre se cache un noyau minuscule : sans lui, l'atome n'existerait pas." },
      { texte: "Une bille de matière pleine et dure", correct: false, pourquoi: "Le noyau est minuscule et le reste de l'atome est presque vide : rien de plein là-dedans." },
      { texte: "Un unique électron géant", correct: false, pourquoi: "Les électrons sont des milliers de fois plus légers que le noyau, et ils tournent autour de lui." }
    ],
    explication: "Un atome, c'est un noyau central (des protons et des neutrons serrés les uns contre les autres) autour duquel voltigent des électrons, très loin du noyau. Le noyau est si petit que si on le représentait par une bille d'un centimètre posée au milieu d'un terrain de foot, les électrons seraient à un kilomètre de là ! Et pourtant, il contient presque toute la masse de l'atome."
  },
  {
    question: "Les atomes sont surtout du vide. Pourquoi ta main ne traverse-t-elle pas la table ?",
    options: [
      { texte: "Parce que les électrons se repoussent très fort", correct: true },
      { texte: "Parce que les atomes de la table n'ont aucun vide", correct: false, pourquoi: "Si : leur vide est même immense par rapport à leur noyau. C'est la répulsion électrique qui bloque." },
      { texte: "Parce que l'air coincé entre les atomes résiste", correct: false, pourquoi: "L'air ne bloque pas une main : on peut la plonger dans l'air sans effort." },
      { texte: "Parce que le bois est plus froid que ta main", correct: false, pourquoi: "La température n'empêche pas de traverser : même une table brûlante resterait infranchissable." }
    ],
    explication: "Les électrons de ta main et ceux de la table portent la même charge électrique : ils se repoussent violemment dès qu'ils s'approchent. Cette répulsion est si forte qu'aucun muscle ne peut la vaincre — c'est elle qui donne aux objets leur « solidité »."
  },
  {
    question: "Combien d'atomes alignés tiendraient à peu près dans un millimètre ?",
    options: [
      { texte: "Une dizaine de millions", correct: true },
      { texte: "Une centaine", correct: false, pourquoi: "Cent atomes mesurent un cent millième de millimètre : c'est encore bien plus petit que ce que l'œil distingue." },
      { texte: "Quelques milliers", correct: false, pourquoi: "C'est dix mille fois trop peu : un millimètre contient une dizaine de millions d'atomes." },
      { texte: "Mille milliards", correct: false, pourquoi: "Là, c'est cent mille fois trop : cette rangée d'atomes mesurerait environ 100 mètres de long !" }
    ],
    explication: "Un atome d'hydrogène mesure environ un dixième de millionième de millimètre : alignés, il en faudrait une dizaine de millions pour faire un seul millimètre. Et dans une simple goutte d'eau, il y en a plus de mille milliards de milliards !"
  },
  {
    question: "Peut-on casser un atome ?",
    options: [
      { texte: "Oui, en cassant son noyau, avec une énergie énorme", correct: true },
      { texte: "Non, c'est la plus petite chose qui existe", correct: false, pourquoi: "Faux : un atome contient des protons, des neutrons et des électrons, et son noyau peut se briser." },
      { texte: "Oui, mais seulement en le brûlant", correct: false, pourquoi: "Brûler, c'est réorganiser les atomes entre eux : ils ressortent intacts, sous forme de gaz et de cendres." },
      { texte: "Oui, en le coupant en deux avec un laser", correct: false, pourquoi: "Un laser peut arracher des électrons, mais il ne coupe pas le noyau en deux." }
    ],
    explication: "On peut casser un noyau : c'est ce qui se passe dans une centrale nucléaire ou dans le cœur d'une étoile. En libérant les morceaux, on récupère une énergie fantastique — mais attention, le mot « atome » veut dire « insécable » en grec, parce que les savants de l'Antiquité croyaient qu'on ne pouvait pas le diviser !"
  },
  {
    question: "Quel atome ne contient qu'un seul proton dans son noyau, et le plus souvent aucun neutron ?",
    options: [
      { texte: "L'hydrogène", correct: true },
      { texte: "L'hélium", correct: false, pourquoi: "L'hélium a deux protons, et deux neutrons dans son noyau le plus courant." },
      { texte: "L'oxygène", correct: false, pourquoi: "L'oxygène compte huit protons : c'est huit fois plus que le plus simple des atomes." },
      { texte: "Le carbone", correct: false, pourquoi: "Le carbone a six protons, et c'est lui qui fait le diamant et le graphite." }
    ],
    explication: "L'hydrogène n'a qu'un proton et, le plus souvent, aucun neutron : un noyau tout simple avec un seul électron autour. C'est l'atome le plus abondant de l'univers et le carburant des étoiles, qui le fusionnent pour fabriquer de l'hélium."
  },
  {
    question: "Pourquoi un ballon gonflé à l'hélium s'envole-t-il dans le ciel ?",
    options: [
      { texte: "Parce que l'hélium est bien plus léger que l'air", correct: true },
      { texte: "Parce qu'on le chauffe comme une montgolfière", correct: false, pourquoi: "Un ballon d'hélium décolle même à température ambiante : ce n'est pas la chaleur qui le soulève." },
      { texte: "Parce qu'il ne pèse absolument rien", correct: false, pourquoi: "L'hélium a bien une masse, mais très faible : un litre ne pèse que 0,18 gramme contre 1,2 gramme pour l'air." },
      { texte: "Parce que le ballon est attiré par le Soleil", correct: false, pourquoi: "Le Soleil est bien trop loin pour tirer un ballon : la poussée vient de l'air autour du ballon." }
    ],
    explication: "Un litre d'air pèse environ 1,2 gramme, un litre d'hélium seulement 0,18 gramme : le ballon est donc plus léger que le volume d'air qu'il déplace, et cet air le pousse vers le haut, comme l'eau repousse un bouchon. L'hélium a été repéré d'abord dans la lumière du Soleil, en 1868, avant d'être trouvé sur Terre : c'est de là que vient son nom (« hélios », le Soleil)."
  },
  {
    question: "Combien d'atomes un atome de carbone peut-il lier à lui en même temps ?",
    options: [
      { texte: "Quatre", correct: true },
      { texte: "Deux, comme l'oxygène", correct: false, pourquoi: "L'oxygène en lie deux (dans H₂O), mais le carbone peut en lier deux fois plus." },
      { texte: "Un seul, comme l'hydrogène", correct: false, pourquoi: "L'hydrogène n'en lie qu'un : c'est justement parce que le carbone en lie quatre qu'il bâtit de si grosses molécules." },
      { texte: "Autant qu'il en trouve", correct: false, pourquoi: "Non, c'est exactement quatre, jamais plus : c'est cette limite qui donne au carbone ses formes si variées." }
    ],
    explication: "Avec quatre bras, le carbone peut s'unir à quatre atomes à la fois, et surtout à d'autres carbones : il forme ainsi de longues chaînes, des anneaux, des cages. C'est pour cela que la vie est bâtie sur le carbone : protéines, sucres, graisses et ADN sont tous des assemblages de carbones. Le diamant (un réseau bien serré) et le graphite (des feuillets) sont deux façons de ranger ces mêmes atomes."
  },
  {
    question: "Une bougie brûle sous un verre retourné. Pourquoi s'éteint-elle au bout de quelques secondes ?",
    options: [
      { texte: "Parce que l'oxygène sous le verre est épuisé", correct: true },
      { texte: "Parce que le verre devient trop chaud", correct: false, pourquoi: "Un verre chaud n'empêche pas de brûler : c'est le manque d'oxygène qui éteint la flamme." },
      { texte: "Parce que la fumée cache la flamme", correct: false, pourquoi: "Une flamme brûle très bien dans une pièce enfumée : ce n'est pas la fumée qui la tue." },
      { texte: "Parce qu'il n'y a plus d'air du tout dessous", correct: false, pourquoi: "Il reste de l'air, mais surtout de l'azote : c'est l'oxygène, environ un cinquième de l'air, qui manque." }
    ],
    explication: "Une flamme a besoin de trois choses : un combustible (la cire), de la chaleur et de l'oxygène. Sous le verre, la bougie consomme l'oxygène disponible et le remplace par du CO₂ et de la vapeur d'eau : quand il n'y a plus assez d'oxygène, la flamme s'éteint. Quand on étouffe un feu, on le prive simplement d'air."
  },
  {
    question: "Les pois, les haricots et les trèfles enrichissent le sol en azote. Grâce à qui ?",
    options: [
      { texte: "À des bactéries logées dans leurs racines", correct: true },
      { texte: "Aux vers de terre qui labourent le sol", correct: false, pourquoi: "Les vers aèrent et mélangent la terre, mais ils ne savent pas fabriquer d'azote utilisable." },
      { texte: "À la pluie, qui en apporte en tombant", correct: false, pourquoi: "La pluie apporte de l'eau, et très peu d'azote : ce n'est pas elle qui nourrit la plante." },
      { texte: "Au Soleil, qui le fabrique en chauffant la terre", correct: false, pourquoi: "Le Soleil réchauffe le sol, mais il ne crée aucun atome : l'azote était déjà dans l'air." }
    ],
    explication: "L'air est fait à 78 % d'azote, mais ce gaz est presque inutilisable : ses deux atomes sont soudés très fort. Certaines bactéries du sol savent casser cette liaison ; installées dans de petites bosses sur les racines des légumineuses, elles donnent l'azote à la plante, qui en échange leur offre du sucre. C'est pourquoi on plante des trèfles ou des haricots pour « reposer » un champ, et pourquoi l'azote de nos engrais sert à fabriquer nos protéines et notre ADN."
  },
  {
    question: "Pourquoi a-t-on des saisons sur Terre ?",
    options: [
      { texte: "Parce que la Terre est inclinée sur son axe", correct: true },
      { texte: "Parce que la Terre se rapproche du Soleil en été", correct: false, pourquoi: "C'est même le contraire : la Terre est légèrement plus loin du Soleil en juillet !" },
      { texte: "Parce que le Soleil devient plus chaud en été", correct: false, pourquoi: "Le Soleil ne change pas : c'est la Terre qui tourne inclinée autour de lui." },
      { texte: "Parce que l'axe de la Terre change de direction au fil de l'année", correct: false, pourquoi: "Non : l'axe reste penché dans la même direction, comme une toupie. C'est la Terre qui avance autour du Soleil en gardant son inclinaison, si bien que chaque hémisphère penche vers le Soleil à tour de rôle." }
    ],
    explication: "C'est l'inclinaison de la Terre (23,5°) qui change l'ensoleillement au cours de l'année, pas la distance au Soleil. En décembre, l'hémisphère nord est incliné à l'opposé du Soleil : c'est l'hiver."
  },
  {
    question: "Combien de temps met la lumière du Soleil pour arriver jusqu'à nous ?",
    options: [
      { texte: "Environ 8 minutes", correct: true },
      { texte: "Environ 8 secondes", correct: false, pourquoi: "Attention à l'unité : c'est 8 minutes, pas 8 secondes. En 8 secondes, la lumière ne parcourt que 2,4 millions de km, à peine six fois la distance Terre-Lune." },
      { texte: "Environ 1 minute", correct: false, pourquoi: "Presque huit fois trop court : en une minute, la lumière ne couvre que 18 millions de km, à peine un huitième du trajet." },
      { texte: "Environ 8 heures", correct: false, pourquoi: "Bien trop long : en 8 heures, la lumière dépasserait Neptune, pourtant trente fois plus loin du Soleil que la Terre." }
    ],
    explication: "La lumière parcourt les 150 millions de km qui nous séparent du Soleil en 8 minutes et 19 secondes exactement (499 secondes). Si le Soleil disparaissait, on ne le saurait que 8 minutes plus tard !"
  },
  {
    question: "Après la mort d'une étoile très massive, son cœur peut laisser une étoile à neutrons. Dans quel cas laisse-t-il plutôt un trou noir ?",
    options: [
      { texte: "Quand l'étoile de départ était encore plus lourde", correct: true },
      { texte: "Quand elle était plus légère et plus froide", correct: false, pourquoi: "C'est l'inverse : une étoile trop légère finit en naine blanche, une simple braise de la taille de la Terre." },
      { texte: "Quand elle tournait très vite sur elle-même", correct: false, pourquoi: "La rotation change la forme de l'effondrement, mais c'est bien la masse qui décide s'il reste une étoile à neutrons ou un trou noir." },
      { texte: "Quand elle se trouvait près d'une autre étoile", correct: false, pourquoi: "Le voisinage peut perturber une étoile, mais pas décider de ce qui reste après sa mort." }
    ],
    explication: "Tout dépend du poids du cœur qui s'effondre. Jusqu'à environ deux fois la masse du Soleil, les neutrons parviennent à le retenir : il reste une étoile à neutrons, une boule d'une vingtaine de kilomètres à peine. Au-delà d'environ trois masses solaires, rien ne peut plus arrêter l'effondrement : la matière se tasse sans limite et forme un trou noir, dont même la lumière ne peut pas ressortir."
  },
  {
    question: "Pourquoi les astronautes flottent-ils à l'intérieur de la Station spatiale internationale ?",
    options: [
      { texte: "Parce qu'ils tombent en permanence autour de la Terre, tout comme la station", correct: true },
      { texte: "Parce qu'il n'y a aucune gravité dans l'espace", correct: false, pourquoi: "Faux : à 400 km d'altitude, la gravité est encore environ 88 % de celle de la surface !" },
      { texte: "Parce que leurs combinaisons contiennent des aimants", correct: false, pourquoi: "Les combinaisons n'ont pas d'aimants, et l'apesanteur règne aussi sans combinaison." },
      { texte: "Parce que l'air de la station les pousse vers le haut", correct: false, pourquoi: "L'air pousse dans toutes les directions, jamais vers le haut uniquement." }
    ],
    explication: "Il y a bien de la gravité là-haut (environ 88 % de celle de la surface !). Mais la station tombe en permanence autour de la Terre, et les astronautes tombent avec elle : c'est l'apesanteur."
  },
  {

/* ---------------- Préparation des diapositives ---------------- */

function melanger(liste) {
  const copie = liste.slice();
  for (let i = copie.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = copie[i];
    copie[i] = copie[j];
    copie[j] = tmp;
  }
  return copie;
}

const LETTRES = ["A", "B", "C", "D"];
const NB_QUESTIONS = 20; // nombre de questions tirées au hasard à chaque partie

// Seuils des mentions, en proportion du nombre de questions (18 / 15 / 10 sur 20)
const SEUIL_NOBEL = Math.round(NB_QUESTIONS * 0.9);
const SEUIL_JEUNE = Math.round(NB_QUESTIONS * 0.75);
const SEUIL_CHERCHEUR = Math.round(NB_QUESTIONS * 0.5);

// Pioche NB_QUESTIONS questions au hasard dans tout le quiz,
// et mélange les propositions de chacune (la lettre change donc à chaque partie).
function tirerQuestions() {
  return melanger(QUESTIONS).slice(0, NB_QUESTIONS).map(function (q) {
    return {
      question: q.question,
      explication: q.explication,
      optionsAffichees: melanger(q.options),
      choix: null,     // index de l'option choisie par l'enfant
      revelee: false   // devient vrai dès que la réponse a été montrée : le score est verrouillé
    };
  });
}

// Diapositives : intro, puis (question, réponse) par question, puis l'écran final
function construireDiapos() {
  const dia = [{ type: "intro" }];
  selection.forEach(function (_, i) {
    dia.push({ type: "question", index: i });
    dia.push({ type: "reponse", index: i });
  });
  dia.push({ type: "final" });
  return dia;
}

let selection = tirerQuestions();
let DIAPOS = construireDiapos();
let position = 0;

/* ---------------- Éléments de la page ---------------- */

const carte = document.getElementById("carte");
const compteur = document.getElementById("compteur");
const progression = document.getElementById("progression");
const btnPrecedent = document.getElementById("btnPrecedent");
const btnSuivant = document.getElementById("btnSuivant");

function scoreActuel() {
  let score = 0;
  selection.forEach(function (q) {
    if (q.choix !== null && q.optionsAffichees[q.choix].correct) score++;
  });
  return score;
}

function mention(score) {
  if (score >= SEUIL_NOBEL) return { titre: "🧪 Prix Nobel en herbe", texte: "Franchement impressionnant !" };
  if (score >= SEUIL_JEUNE) return { titre: "🔬 Jeune scientifique", texte: "Très solide, encore quelques notions à explorer." };
  if (score >= SEUIL_CHERCHEUR) return { titre: "🌱 Chercheur en herbe", texte: "Bonne base, continue à poser des questions !" };
  return { titre: "🚀 Astronaute en formation", texte: "Chaque scientifique a commencé quelque part !" };
}

/* ---------------- Rendu des diapositives ---------------- */

function rendreIntro() {
  return `
    <div class="type-ligne"><span class="badge-etape">🔬 Présentation</span></div>
    <h2 class="question-texte">Prêt(e) pour le défi science ?</h2>
    <ul class="intro-liste">
      <li>🎲 <strong>${NB_QUESTIONS} questions tirées au hasard</strong> parmi les ${QUESTIONS.length} du quiz : à chaque partie, jamais tout à fait le même défi !</li>
      <li>👀 Tu vois <strong>une question</strong>, puis sur l'écran suivant <strong>la réponse expliquée</strong>.</li>
      <li>🖱️ Clique sur la bonne réponse avant de passer à la suite (c'est pour ton score, mais on ne voit rien tout de suite !). Une fois la réponse découverte, ton choix est verrouillé.</li>
      <li>💡 Si tu te trompes, l'écran suivant t'explique <strong>pourquoi ta réponse était fausse</strong>.</li>
      <li>🏆 À la fin : ton score, ta mention et le barème des niveaux.</li>
    </ul>
    <div class="explication"><strong>Pas de triche !</strong> L'important, c'est de comprendre les explications. Même les scientifiques se trompent parfois... et c'est comme ça qu'on apprend.</div>`;
}

function rendreQuestion(i) {
  const q = selection[i];
  let html = `
    <div class="type-ligne">
      <span class="numero-question">Question ${i + 1} / ${selection.length}</span>
    </div>
    <h2 class="question-texte">${q.question}</h2>
    <div class="options">`;

  q.optionsAffichees.forEach(function (opt, j) {
    let classe = "option";
    if (q.revelee) {
      // La réponse a déjà été montrée : le choix est verrouillé
      classe += " verrouillee";
      if (opt.correct) {
        classe += " bonne";
      } else if (q.choix === j) {
        classe += " fausse";
      }
    } else if (q.choix === j) {
      classe += " choisie";
    }
    const balise = q.revelee ? "div" : "button";
    html += `
      <${balise} class="${classe}" data-option="${j}">
        <span class="lettre">${LETTRES[j]}</span>
        <span>${opt.texte}</span>
      </${balise}>`;
  });

  html += `
    </div>
    <div class="explication">${q.revelee
      ? "<strong>🔒 Réponse déjà validée :</strong> elle ne peut plus être changée. Clique sur « Voir la réponse → » pour revoir l'explication."
      : "<strong>Astuce :</strong> choisis ta réponse, puis clique sur « Voir la réponse » pour découvrir l'explication."}</div>`;
  return html;
}

function rendreReponse(i) {
  const q = selection[i];
  const aChoisi = q.choix !== null;
  const optChoisie = aChoisi ? q.optionsAffichees[q.choix] : null;
  const juste = aChoisi && optChoisie.correct;

  let etiquette;
  if (!aChoisi) {
    etiquette = `<div class="etiquette-reponse rate">🤔 Pas de réponse choisie pour cette question</div>`;
  } else if (juste) {
    etiquette = `<div class="etiquette-reponse">✅ Bravo, c'est correct !</div>`;
  } else {
    etiquette = `<div class="etiquette-reponse rate">❌ Pas tout à fait... on apprend avec ses erreurs !</div>`;
  }

  // Explication ciblée : pourquoi LA réponse choisie par l'enfant est fausse
  let noteErreur = "";
  if (optChoisie && !juste && optChoisie.pourquoi) {
    noteErreur = `
    <div class="explication erreur"><strong>Tu as répondu « ${optChoisie.texte} » :</strong> ${optChoisie.pourquoi}</div>`;
  }

  let html = `
    <div class="type-ligne">
      <span class="numero-question">Réponse ${i + 1} / ${selection.length}</span>
    </div>
    ${etiquette}
    <h2 class="question-texte">${q.question}</h2>
    <div class="options">`;

  q.optionsAffichees.forEach(function (opt, j) {
    let classe = "option verrouillee";
    if (opt.correct) {
      classe += " bonne";
    } else if (q.choix === j) {
      classe += " fausse";
    }
    html += `
      <div class="${classe}">
        <span class="lettre">${LETTRES[j]}</span>
        <span>${opt.texte}</span>
      </div>`;
  });

  html += `
    </div>${noteErreur}
    <div class="explication"><strong>Pourquoi ?</strong> ${q.explication}</div>`;
  return html;
}

function rendreFinal() {
  const score = scoreActuel();
  const sansReponse = selection.filter(function (q) { return q.choix === null; }).length;
  const erreurs = selection.length - score - sansReponse;
  const m = mention(score);
  return `
    <div class="bloc-final">
      <div class="type-ligne"><span class="badge-etape">🏆 Résultat final</span></div>
      <div class="grand-score">${score} / ${selection.length}</div>
      <p style="font-size:1.1rem;">✅ ${score} bonne${score > 1 ? "s" : ""} réponse${score > 1 ? "s" : ""} · ❌ ${erreurs} erreur${erreurs > 1 ? "s" : ""} · 🤔 ${sansReponse} sans réponse</p>
      <div class="mention">${m.titre}</div>
      <p style="font-size:1.15rem; line-height:1.5;">${m.texte}</p>
      <table class="bareme">
        <tr><th>Score</th><th>Niveau</th></tr>
        <tr><td>${SEUIL_NOBEL}–${NB_QUESTIONS}</td><td>🧪 Prix Nobel en herbe</td></tr>
        <tr><td>${SEUIL_JEUNE}–${SEUIL_NOBEL - 1}</td><td>🔬 Jeune scientifique</td></tr>
        <tr><td>${SEUIL_CHERCHEUR}–${SEUIL_JEUNE - 1}</td><td>🌱 Chercheur en herbe</td></tr>
        <tr><td>0–${SEUIL_CHERCHEUR - 1}</td><td>🚀 Astronaute en formation</td></tr>
      </table>
      <button class="bouton primaire" id="btnRecommencer" style="max-width:100%;">🔄 Recommencer le quiz</button>
    </div>`;
}

function rendre() {
  const dia = DIAPOS[position];

  if (dia.type === "intro") {
    carte.innerHTML = rendreIntro();
    compteur.textContent = "Bienvenue !";
  } else if (dia.type === "question") {
    carte.innerHTML = rendreQuestion(dia.index);
    compteur.textContent = "Question " + (dia.index + 1) + " / " + selection.length;
    if (!selection[dia.index].revelee) {
      carte.querySelectorAll(".option").forEach(function (bouton) {
        bouton.addEventListener("click", function () {
          selection[dia.index].choix = parseInt(bouton.getAttribute("data-option"), 10);
          rendre();
        });
      });
    }
  } else if (dia.type === "reponse") {
    selection[dia.index].revelee = true; // verrouille le choix : il ne peut plus changer
    carte.innerHTML = rendreReponse(dia.index);
    compteur.textContent = "Réponse " + (dia.index + 1) + " / " + selection.length;
  } else {
    carte.innerHTML = rendreFinal();
    compteur.textContent = "Terminé !";
    document.getElementById("btnRecommencer").addEventListener("click", recommencer);
  }

  // Barre de progression : intro = 0 %, écran final = 100 %
  const pourcentage = Math.round((position / (DIAPOS.length - 1)) * 100);
  progression.style.width = pourcentage + "%";

  // Bouton précédent
  btnPrecedent.disabled = position === 0;

  // Libellé du bouton suivant
  if (dia.type === "intro") {
    btnSuivant.textContent = "Commencer le quiz 🚀";
    btnSuivant.style.display = "";
  } else if (dia.type === "question") {
    btnSuivant.textContent = "Voir la réponse →";
    btnSuivant.style.display = "";
  } else if (dia.type === "reponse") {
    const derniere = dia.index === selection.length - 1;
    btnSuivant.textContent = derniere ? "Voir mon score 🏆" : "Question suivante →";
    btnSuivant.style.display = "";
  } else {
    btnSuivant.style.display = "none";
  }

  carte.scrollTop = 0;
}

function avancer() {
  if (position < DIAPOS.length - 1) {
    position++;
    rendre();
  }
}

function reculer() {
  if (position > 0) {
    position--;
    rendre();
  }
}

function recommencer() {
  selection = tirerQuestions(); // un tout nouveau tirage de 20 questions
  DIAPOS = construireDiapos();
  position = 0;
  rendre();
}

/* ---------------- Événements ---------------- */

btnSuivant.addEventListener("click", avancer);
btnPrecedent.addEventListener("click", reculer);

document.addEventListener("keydown", function (e) {
  if (e.key === "ArrowRight" || e.key === " ") {
    // Sur un bouton, la barre d'espace doit activer le bouton (choisir une option,
    // ou cliquer sur « Suivant »), pas faire avancer en double.
    if (e.key === " " && e.target && e.target.closest && e.target.closest("button")) return;
    if (DIAPOS[position].type !== "final" && btnSuivant.style.display !== "none") {
      e.preventDefault();
      avancer();
    }
  } else if (e.key === "ArrowLeft") {
    e.preventDefault();
    reculer();
  }
});

rendre();
</script>
</body>
</html>
