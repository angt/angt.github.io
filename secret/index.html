<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<title>secret</title>
<style>
  :root { color-scheme: dark; background: #0d0d10; color: #e8e8ec; }
  * { box-sizing: border-box; }
  body {
    max-width: 560px; margin: 0 auto; padding: 1rem;
    font: 16px ui-monospace, Menlo, Consolas, monospace;
  }
  button, input { font: inherit; }
  button {
    min-height: 44px; border: 0; border-radius: 4px;
    background: #1c1c22; color: inherit; cursor: pointer;
  }
  button:hover, button:focus-visible { background: #292931; }
  button:focus-visible, input:focus-visible { outline: 2px solid #77778a; }
  button:disabled { opacity: .5; cursor: default; }
  [hidden] { display: none !important; }
  header { display: flex; align-items: center; justify-content: space-between; }
  #welcome-logo {
    --glitch-duration: 600ms;
    --jolt-x: 5px; --jolt-y: 2px; --jolt-return-x: -4px; --jolt-return-y: -2px;
    --jolt-skew: -.8deg; --echo-cyan: -10px; --echo-red: 10px;
    --slice-a: inset(18% 0 70% 0); --slice-a-x: -12px;
    --slice-b: inset(62% 0 29% 0); --slice-b-x: 12px;
    --slice-c: inset(43% 0 47% 0); --slice-c-x: -14px;
    --slice-d: inset(76% 0 17% 0); --slice-d-x: 14px;
    position: relative; width: 100%; margin: 0 auto; isolation: isolate;
    overflow: hidden;
  }
  #welcome-logo::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent 0 3px, #0d0d1026 3px 4px);
  }
  .logo-base { display: block; width: 100%; height: auto; }
  .logo-echo {
    position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0;
    pointer-events: none; mix-blend-mode: screen;
  }
  .logo-cyan {
    --echo-x: var(--echo-cyan); --echo-opacity: .65;
    filter: sepia(1) saturate(5) hue-rotate(125deg);
  }
  .logo-red {
    --echo-x: var(--echo-red); --echo-opacity: .55;
    filter: brightness(0) invert(30%) sepia(1) saturate(50) hue-rotate(345deg);
  }
  #welcome-logo.glitching {
    animation: logo-tracking var(--glitch-duration) steps(1, end) both;
  }
  #welcome-logo.glitching .logo-base {
    animation: logo-base var(--glitch-duration) steps(1, end) both;
  }
  #welcome-logo.glitching .logo-echo {
    animation: logo-echo var(--glitch-duration) steps(1, end) both;
  }
  @keyframes logo-tracking {
    0%, 5%, 18%, 23%, 37%, 45%, 59%, 65%, 83%, 100% { transform: translate(0); }
    6%, 24%, 46%, 66% {
      transform: translate(var(--jolt-x), var(--jolt-y)) skewX(var(--jolt-skew));
    }
    10%, 29%, 50%, 70% { transform: translate(var(--jolt-return-x), var(--jolt-return-y)); }
    14%, 34%, 54%, 74% {
      transform: translate(var(--jolt-return-x), var(--jolt-y)) skewX(var(--jolt-skew));
    }
    78% { transform: translate(var(--jolt-x), var(--jolt-return-y)); }
  }
  @keyframes logo-base {
    0%, 5%, 18%, 23%, 37%, 45%, 59%, 65%, 83%, 100% {
      transform: translate(0); clip-path: none;
    }
    6%, 46% { transform: translateX(var(--slice-a-x)); clip-path: var(--slice-a); }
    10%, 50%, 70% { transform: translateX(var(--slice-b-x)); clip-path: var(--slice-b); }
    14%, 54%, 74% { transform: translateX(var(--slice-c-x)); clip-path: var(--slice-c); }
    24%, 66% { transform: translateX(var(--slice-d-x)); clip-path: var(--slice-d); }
    29%, 78% { transform: translateX(var(--slice-a-x)); clip-path: var(--slice-b); }
    34% { transform: translateX(var(--slice-c-x)); clip-path: var(--slice-a); }
  }
  @keyframes logo-echo {
    0%, 5%, 18%, 23%, 37%, 45%, 59%, 65%, 83%, 100% {
      opacity: 0; transform: translate(0); clip-path: none;
    }
    6%, 10%, 14%, 24%, 29%, 34%, 46%, 50%, 54%, 66%, 70%, 74%, 78% {
      opacity: var(--echo-opacity); transform: translateX(var(--echo-x));
    }
    6%, 46% { clip-path: var(--slice-a); }
    10%, 50%, 70% { clip-path: var(--slice-b); }
    14%, 54%, 74% { clip-path: var(--slice-c); }
    24%, 66% { clip-path: var(--slice-d); }
    29%, 78% { clip-path: var(--slice-b); }
    34% { clip-path: var(--slice-a); }
  }
  @media (prefers-reduced-motion: reduce) {
    #welcome-logo, #welcome-logo * { animation: none !important; }
    #welcome-logo::after, .logo-echo { display: none; }
  }
  #brand-logo { flex: none; }
  #lock { padding: 0 .8rem; color: #9999a8; }
  #unlock-form { display: flex; gap: .5rem; margin: 1rem 0; }
  #pass {
    min-width: 0; flex: 1; padding: .6rem 0; border: 0; outline: 0;
    border-bottom: 1px solid #44444f; background: none; color: inherit;
  }
  #unlock, #retry { padding: 0 1rem; }
  #msg { min-height: 1.5em; color: #77778a; font-size: .85rem; }
  #msg.error { color: #e07a7a; }
  .entry { border-bottom: 1px solid #232329; }
  .entry-heading { display: flex; align-items: center; gap: .75rem; }
  .name {
    flex: 1; min-width: 0; padding: .7rem 0; background: none; text-align: left;
    overflow-wrap: anywhere; touch-action: manipulation;
    -webkit-touch-callout: none;
  }
  .name:hover { background: none; }
  .copy-status { flex: none; color: #8fbf9f; font-size: .85rem; }
  .value {
    margin: 0; padding: 0 .5rem 1rem; white-space: pre-wrap; overflow-wrap: anywhere;
    color: #b8b8c5; user-select: text; -webkit-user-select: text;
  }
  .value.totp { font-size: 2.2rem; letter-spacing: .12em; }
  .remaining { padding: 0 .5rem .7rem; color: #77778a; font-size: .85rem; }
  .local { margin-top: 2rem; color: #555561; font-size: .75rem; }
</style>
</head>
<body>
<header>
  <img id="brand-logo" src="logo.png" draggable="false" alt="secret" width="64" height="64" hidden>
  <button id="lock" type="button" hidden>lock</button>
</header>
<div id="welcome-logo">
  <img class="logo-base" src="logo.png" draggable="false" alt="secret" width="1254" height="1254">
  <img class="logo-echo logo-cyan" src="logo.png" draggable="false" alt="" width="1254" height="1254" aria-hidden="true">
  <img class="logo-echo logo-red" src="logo.png" draggable="false" alt="" width="1254" height="1254" aria-hidden="true">
</div>
<form id="unlock-form">
  <input id="pass" type="password" placeholder="passphrase" autocomplete="current-password" spellcheck="false" aria-label="Passphrase" autofocus disabled>
  <button id="unlock" type="submit" disabled>unlock</button>
</form>
<p id="msg" role="status">loading store…</p>
<button id="retry" type="button" hidden>retry</button>
<div id="list" hidden></div>
<script type="module" src="app.js?v=6"></script>
</body>
</html>
