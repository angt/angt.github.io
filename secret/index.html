<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<title>secret</title>
<style>
  :root { color-scheme: dark; background: #0d0d10; color: #e8e8ec; }
  * { box-sizing: border-box; }
  body {
    max-width: 560px; margin: 0 auto; padding: 1rem;
    font: 16px ui-monospace, Menlo, Consolas, monospace;
  }
  button, input { font: inherit; }
  button {
    min-height: 44px; border: 0; border-radius: 4px;
    background: #1c1c22; color: inherit; cursor: pointer;
  }
  button:hover, button:focus-visible { background: #292931; }
  button:focus-visible, input:focus-visible { outline: 2px solid #77778a; }
  button:disabled { opacity: .5; cursor: default; }
  [hidden] { display: none !important; }
  header { display: flex; align-items: center; justify-content: space-between; }
  h1 { font-size: 1rem; font-weight: normal; }
  #lock { padding: 0 .8rem; color: #9999a8; }
  #unlock-form { display: flex; gap: .5rem; margin: 1rem 0; }
  #pass {
    min-width: 0; flex: 1; padding: .6rem 0; border: 0;
    border-bottom: 1px solid #44444f; background: none; color: inherit;
  }
  #unlock, #retry { padding: 0 1rem; }
  #msg { min-height: 1.5em; color: #77778a; font-size: .85rem; }
  #msg.error { color: #e07a7a; }
  .entry { border-bottom: 1px solid #232329; }
  .entry-heading { display: flex; align-items: center; gap: .75rem; }
  .name {
    flex: 1; min-width: 0; padding: .7rem 0; background: none; text-align: left;
    overflow-wrap: anywhere; touch-action: manipulation;
    -webkit-touch-callout: none;
  }
  .copy-status { flex: none; color: #8fbf9f; font-size: .85rem; }
  .value {
    margin: 0; padding: 0 .5rem 1rem; white-space: pre-wrap; overflow-wrap: anywhere;
    color: #b8b8c5; user-select: text; -webkit-user-select: text;
  }
  .value.totp { font-size: 2.2rem; letter-spacing: .12em; }
  .remaining { padding: 0 .5rem .7rem; color: #77778a; font-size: .85rem; }
  .local { margin-top: 2rem; color: #555561; font-size: .75rem; }
</style>
</head>
<body>
<header>
  <h1>secret</h1>
  <button id="lock" type="button" hidden>lock</button>
</header>
<form id="unlock-form">
  <input id="pass" type="password" placeholder="passphrase" autocomplete="current-password" spellcheck="false" aria-label="Passphrase" disabled>
  <button id="unlock" type="submit" disabled>unlock</button>
</form>
<p id="msg" role="status">loading store…</p>
<button id="retry" type="button" hidden>retry</button>
<div id="list" hidden></div>
<p class="local">decrypted locally · nothing is uploaded</p>
<script type="module" src="app.js?v=4"></script>
</body>
</html>
