<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<title>secret</title>
<style>
  :root { color-scheme: dark; background: #0d0d10; color: #e8e8ec; }
  * { box-sizing: border-box; }
  body {
    max-width: 560px; margin: 0 auto; padding: 1rem;
    font: 16px ui-monospace, Menlo, Consolas, monospace;
  }
  button, input { font: inherit; }
  button {
    min-height: 44px; border: 0; border-radius: 4px;
    background: #1c1c22; color: inherit; cursor: pointer;
  }
  button:hover, button:focus-visible { background: #292931; }
  button:focus-visible, input:focus-visible { outline: 2px solid #77778a; }
  button:disabled { opacity: .5; cursor: default; }
  [hidden] { display: none !important; }
  header { display: flex; align-items: center; justify-content: space-between; }
  h1 { font-size: 1rem; font-weight: normal; }
  #lock { padding: 0 .8rem; color: #9999a8; }
  #unlock-form { display: flex; gap: .5rem; margin: 1rem 0; }
  #pass {
    min-width: 0; flex: 1; padding: .6rem 0; border: 0;
    border-bottom: 1px solid #44444f; background: none; color: inherit;
  }
  #unlock { padding: 0 1rem; }
  #msg { min-height: 1.5em; color: #77778a; font-size: .85rem; }
  #msg.error { color: #e07a7a; }
  .entry {
    display: grid; grid-template-columns: minmax(0, 1fr) auto auto;
    align-items: center; gap: .5rem; border-bottom: 1px solid #232329;
  }
  .entry.selected .name { color: #9db8ff; }
  .name {
    min-width: 0; padding: .7rem 0; background: none; text-align: left;
    overflow-wrap: anywhere;
  }
  .preview { color: #b8b8c5; letter-spacing: .08em; white-space: nowrap; }
  .preview small { display: block; color: #666675; letter-spacing: 0; text-align: right; }
  .copy { width: 44px; color: #9999a8; background: none; }
  #viewer { margin-top: 1.2rem; padding-top: 1rem; border-top: 1px solid #34343e; }
  #selected-name { color: #77778a; overflow-wrap: anywhere; }
  #value {
    margin: .8rem 0; white-space: pre-wrap; overflow-wrap: anywhere;
    user-select: text; -webkit-user-select: text;
  }
  #value.totp { font-size: 2.2rem; letter-spacing: .12em; }
  #remaining { color: #77778a; font-size: .85rem; }
  .local { margin-top: 2rem; color: #555561; font-size: .75rem; }
  @media (max-width: 420px) {
    .entry { grid-template-columns: minmax(0, 1fr) auto; }
    .copy { grid-column: 2; grid-row: 1; }
    .preview { grid-column: 1; grid-row: 2; padding-bottom: .5rem; text-align: left; }
    .preview small { display: inline; margin-left: .5rem; }
  }
</style>
</head>
<body>
<header>
  <h1>secret</h1>
  <button id="lock" type="button" hidden>lock</button>
</header>
<form id="unlock-form">
  <input id="pass" type="password" placeholder="passphrase" autocomplete="current-password" spellcheck="false" aria-label="Passphrase" disabled>
  <button id="unlock" type="submit" disabled>unlock</button>
</form>
<p id="msg" role="status">loading store…</p>
<div id="list" hidden></div>
<section id="viewer" hidden>
  <div id="selected-name"></div>
  <pre id="value"></pre>
  <div id="remaining" hidden></div>
</section>
<p class="local">decrypted locally · nothing is uploaded</p>
<script type="module" src="app.js"></script>
</body>
</html>
