<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>secret</title>
<style>
  body {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 16px;
    background: #0d0d10;
    color: #e8e8ec;
    margin: 0;
    padding: 1rem;
    max-width: 480px;
    margin-left: auto;
    margin-right: auto;
  }
  #pass {
    width: 100%;
    background: none;
    border: none;
    color: inherit;
    font: inherit;
    padding: 0.5rem 0;
    appearance: none;
    -webkit-appearance: none;
    caret-color: #e8e8ec;
  }
  #pass:focus { outline: none; }
  .msg { color: #77778a; margin: 0.5rem 0; word-break: break-word; }
  .msg.error { color: #e07a7a; }
  .entry {
    margin: 0.5rem 0;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    word-break: break-all;
  }
  .value {
    position: fixed;
    top: 1rem;
    left: 1rem;
    right: 1rem;
    word-break: break-all;
    user-select: text;
  }
</style>
</head>
<body>
<input id="pass" type="password" placeholder="passphrase" autocomplete="new-password" spellcheck="false">
<p id="msg" class="msg"></p>
<div id="secret-list" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
