<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d0d10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<title>secret</title>
<style>
  :root { color-scheme: dark; background: #0d0d10; color: #e8e8ec; }
  * { box-sizing: border-box; }
  body {
    max-width: 560px; margin: 0 auto; padding: 1rem;
    font: 16px ui-monospace, Menlo, Consolas, monospace;
  }
  html:has(body.locked), body.locked {
    height: 100%; height: 100dvh;
    overflow: hidden; overscroll-behavior: none;
  }
  body.locked { display: flex; flex-direction: column; }
  #gate { width: 100%; }
  body.locked #gate { margin: auto; }
  button, input { font: inherit; }
  button {
    min-height: 44px; border: 0; border-radius: 4px;
    background: #1c1c22; color: inherit; cursor: pointer;
  }
  button:hover, button:focus-visible { background: #292931; }
  button:focus-visible, input:focus-visible { outline: 2px solid #77778a; }
  button:disabled { opacity: .5; cursor: default; }
  [hidden] { display: none !important; }
  header { display: flex; align-items: center; justify-content: space-between; }
  #welcome-logo {
    --glitch-duration: 600ms;
    --jolt-x: 5px; --jolt-y: 2px; --jolt-return-x: -4px; --jolt-return-y: -2px;
    --jolt-skew: -.8deg; --echo-cyan: -10px; --echo-red: 10px;
    --slice-a: inset(18% 0 70% 0); --slice-a-x: -12px;
    --slice-b: inset(62% 0 29% 0); --slice-b-x: 12px;
    --slice-c: inset(43% 0 47% 0); --slice-c-x: -14px;
    --slice-d: inset(76% 0 17% 0); --slice-d-x: 14px;
    position: relative; width: 100%; max-width: 50vh; max-width: 50dvh;
    margin: 0 auto; isolation: isolate; overflow: hidden;
  }
  #welcome-logo::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent 0 3px, #0d0d1026 3px 4px);
  }
  .logo-base { display: block; width: 100%; height: auto; }
  .logo-echo {
    position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0;
    pointer-events: none; mix-blend-mode: screen;
  }
  .logo-cyan {
    --echo-x: var(--echo-cyan); --echo-opacity: .65;
    filter: sepia(1) saturate(5) hue-rotate(125deg);
  }
  .logo-red {
    --echo-x: var(--echo-red); --echo-opacity: .55;
    filter: brightness(0) invert(30%) sepia(1) saturate(50) hue-rotate(345deg);
  }
  #welcome-logo.glitching {
    animation: logo-tracking var(--glitch-duration) steps(1, end) both;
  }
  #welcome-logo.glitching .logo-base {
    animation: logo-base var(--glitch-duration) steps(1, end) both;
  }
  #welcome-logo.glitching .logo-echo {
    animation: logo-echo var(--glitch-duration) steps(1, end) both;
  }
  @keyframes logo-tracking {
    0%, 5%, 18%, 23%, 37%, 45%, 59%, 65%, 83%, 100% { transform: translate(0); }
    6%, 24%, 46%, 66% {
      transform: translate(var(--jolt-x), var(--jolt-y)) skewX(var(--jolt-skew));
    }
    10%, 29%, 50%, 70% { transform: translate(var(--jolt-return-x), var(--jolt-return-y)); }
    14%, 34%, 54%, 74% {
      transform: translate(var(--jolt-return-x), var(--jolt-y)) skewX(var(--jolt-skew));
    }
    78% { transform: translate(var(--jolt-x), var(--jolt-return-y)); }
  }
  @keyframes logo-base {
    0%, 5%, 18%, 23%, 37%, 45%, 59%, 65%, 83%, 100% {
      transform: translate(0); clip-path: none;
    }
    6%, 46% { transform: translateX(var(--slice-a-x)); clip-path: var(--slice-a); }
    10%, 50%, 70% { transform: translateX(var(--slice-b-x)); clip-path: var(--slice-b); }
    14%, 54%, 74% { transform: translateX(var(--slice-c-x)); clip-path: var(--slice-c); }
    24%, 66% { transform: translateX(var(--slice-d-x)); clip-path: var(--slice-d); }
    29%, 78% { transform: translateX(var(--slice-a-x)); clip-path: var(--slice-b); }
    34% { transform: translateX(var(--slice-c-x)); clip-path: var(--slice-a); }
  }
  @keyframes logo-echo {
    0%, 5%, 18%, 23%, 37%, 45%, 59%, 65%, 83%, 100% {
      opacity: 0; transform: translate(0); clip-path: none;
    }
    6%, 10%, 14%, 24%, 29%, 34%, 46%, 50%, 54%, 66%, 70%, 74%, 78% {
      opacity: var(--echo-opacity); transform: translateX(var(--echo-x));
    }
    6%, 46% { clip-path: var(--slice-a); }
    10%, 50%, 70% { clip-path: var(--slice-b); }
    14%, 54%, 74% { clip-path: var(--slice-c); }
    24%, 66% { clip-path: var(--slice-d); }
    29%, 78% { clip-path: var(--slice-b); }
    34% { clip-path: var(--slice-a); }
  }
  @media (prefers-reduced-motion: reduce) {
    #welcome-logo, #welcome-logo * { animation: none !important; }
    #welcome-logo::after, .logo-echo { display: none; }
  }
  #brand-logo { flex: none; }
  #lock { padding: 0 .8rem; color: #9999a8; }
  #unlock-form { margin: 1rem 0; }
  #pass-row { display: flex; align-items: center; gap: .4rem; }
  #pass {
    min-width: 0; flex: 1; padding: .6rem 0; border: 0; outline: 0;
    border-bottom: 1px solid #44444f; background: none; color: inherit;
  }
  #keyboard-toggle, #keyboard-shuffle {
    display: grid; place-items: center; flex: none;
    width: 44px; padding: 0; color: #77778a; background: none;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  #keyboard-toggle[aria-pressed="true"],
  #keyboard-toggle:hover, #keyboard-shuffle:hover { background: #1c1c22; }
  #keyboard-toggle[aria-pressed="true"] { color: #d1d1dc; }
  #keyboard-bar { display: flex; justify-content: flex-end; padding: .3rem 0 0; }
  .shuffle-icon { display: block; transition: transform .3s cubic-bezier(.2, .9, .2, 1.3); }
  #keyboard-shuffle:hover .shuffle-icon,
  #keyboard-shuffle:focus-visible .shuffle-icon { transform: scale(1.12); }
  #unlock, #retry { padding: 0 1rem; }
  #keyboard {
    margin-top: .75rem; padding: .35rem; user-select: none; -webkit-user-select: none;
    border: 1px solid #232329; border-radius: 12px; background: #111116;
  }
  #keyboard-pages {
    display: flex; overflow-x: auto; scrollbar-width: none;
    touch-action: pan-x; scroll-snap-type: x mandatory;
    overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch;
  }
  #keyboard-pages::-webkit-scrollbar { display: none; }
  .keyboard-panel {
    display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); flex: 0 0 100%;
    gap: clamp(3px, .8vw, 5px); scroll-snap-align: start; scroll-snap-stop: always;
  }
  .key {
    min-width: 0; height: 44px;
    padding: 0; border-radius: 7px; background: #25252e; color: #f1f1f5;
    box-shadow: 0 1px 0 #08080b; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .key:active { background: #454553; box-shadow: none; }
  @media (max-width: 360px) {
    #pass-row { gap: .2rem; }
    #unlock { padding: 0 .6rem; }
    #keyboard { padding: .25rem; }
    .key { font-size: .9rem; }
  }
  body.using-keyboard #welcome-logo {
    width: min(100%, max(84px, calc(100dvh - 424px)));
  }
  @media (max-height: 560px) {
    body.using-keyboard #welcome-logo { display: none; }
    body.locked.using-keyboard { overflow-y: auto; }
    body.using-keyboard #unlock-form { margin: .5rem 0; }
    body.using-keyboard #keyboard { margin-top: .5rem; }
  }
  #msg { min-height: 1.5em; color: #77778a; font-size: .85rem; }
  #msg.error { color: #e07a7a; }
  .entry { border-bottom: 1px solid #232329; }
  .entry-heading { display: flex; align-items: center; gap: .75rem; }
  .name {
    flex: 1; min-width: 0; padding: .7rem 0; background: none; text-align: left;
    overflow-wrap: anywhere; touch-action: manipulation;
    -webkit-touch-callout: none;
  }
  .name:hover { background: none; }
  .copy-status { flex: none; color: #8fbf9f; font-size: .85rem; }
  .value {
    margin: 0; padding: 0 .5rem 1rem; white-space: pre-wrap; overflow-wrap: anywhere;
    color: #b8b8c5; user-select: text; -webkit-user-select: text;
  }
  .value.totp { font-size: 2.2rem; letter-spacing: .12em; }
  .remaining { padding: 0 .5rem .7rem; color: #77778a; font-size: .85rem; }
</style>
</head>
<body class="locked">
<header>
  <img id="brand-logo" src="logo.png" draggable="false" alt="secret" width="64" height="64" hidden>
  <button id="lock" type="button" hidden>lock</button>
</header>
<main id="gate">
  <div id="welcome-logo">
    <img class="logo-base" src="logo.png" draggable="false" alt="secret" width="1254" height="1254">
    <img class="logo-echo logo-cyan" src="logo.png" draggable="false" alt="" width="1254" height="1254" aria-hidden="true">
    <img class="logo-echo logo-red" src="logo.png" draggable="false" alt="" width="1254" height="1254" aria-hidden="true">
  </div>
  <form id="unlock-form">
    <div id="pass-row">
      <input id="pass" type="password" placeholder="passphrase" autocomplete="current-password" spellcheck="false" aria-label="Passphrase" autofocus disabled>
      <button id="keyboard-toggle" type="button" aria-label="Use on-screen keyboard" aria-pressed="false" aria-controls="keyboard" title="Use on-screen keyboard" disabled>
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
          <rect x="2.5" y="5.5" width="19" height="13" rx="2"/>
          <path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 12h.01M10 12h.01M14 12h.01M18 12h.01M8 15h8"/>
        </svg>
      </button>
      <button id="unlock" type="submit" disabled>unlock</button>
    </div>
    <div id="keyboard" role="group" aria-label="On-screen keyboard" hidden>
      <div id="keyboard-pages"></div>
    </div>
    <div id="keyboard-bar" hidden>
      <button id="keyboard-shuffle" type="button" aria-label="Shuffle keys on this page" title="Shuffle keys on this page">
        <svg class="shuffle-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 7h3.5c1 0 1.9.4 2.5 1.2l6 7.6c.6.8 1.5 1.2 2.5 1.2H21"/>
          <path d="M3 17h3.5c1 0 1.9-.4 2.5-1.2l6-7.6c.6-.8 1.5-1.2 2.5-1.2H21"/>
          <path d="M18 4l3 3-3 3"/>
          <path d="M18 14l3 3-3 3"/>
        </svg>
      </button>
    </div>
  </form>
  <p id="msg" role="status">loading store…</p>
  <button id="retry" type="button" hidden>retry</button>
  <div id="list" hidden></div>
</main>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js")
      .catch(error => console.warn("Offline support unavailable:", error));
  }
</script>
<script type="module" src="app.js?v=9"></script>
</body>
</html>
